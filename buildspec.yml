version: 0.2

phases:
  install:
    commands:
      - echo "Installing C++ compiler and essential Linux tools..."
      - apt-get update -y
      - apt-get install -y build-essential
  pre_build:
    commands:
      - echo "Verifying project structure and setting permissions..."
      - ls -la
      - chmod +x checker/run_tests.sh
  build:
    commands:
      - echo "Compiling components and executing the test suite..."
      - cd checker && ./run_tests.sh
  post_build:
    commands:
      - echo "AWS Cloud build and validation completed successfully!"
