version: 0.2

phases:
  install:
    commands:
      - echo "Installing C++ compiler and testing utilities..."
      - apt-get update -y
      - apt-get install -y build-essential psmisc bc dos2unix
  pre_build:
    commands:
      - echo "Fixing file permissions and patching race conditions..."
      - chmod +x checker/*.sh
      - dos2unix checker/*.sh
      - sed -i 's/sleep 1/sleep 4/g' checker/run_tests.sh
  build:
    commands:
      - echo "Executing the test suite..."
      - cd checker && ./run_tests.sh
  post_build:
    commands:
      - echo "Printing internal logs in case of hidden errors..."
      - cat checker/output/dispatcher.log || true
      - cat checker/output/service.log || true
      - echo "AWS Cloud validation finished."
