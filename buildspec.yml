version: 0.2

phases:
  install:
    commands:
      - echo "Installing C++ compiler and testing utilities..."
      - apt-get update -y
      - apt-get install -y build-essential psmisc bc dos2unix
  pre_build:
    commands:
      - echo "Fixing file permissions and line endings..."
      - mkdir -p checker/output
      - chmod +x checker/*.sh
      - dos2unix checker/*.sh
  build:
    commands:
      - echo "Executing the test suite..."
      - cd checker && ./run_tests.sh
  post_build:
    commands:
      - echo "AWS Cloud build and validation completed successfully!"
